<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTA Guard — Interactive Demo</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="demo-banner">
  🎬 DEMO — sample data only. No real connection to any OTA, Channel Manager or AI provider.
  This reproduces the real OTA Guard v3 desktop interface screen by screen.
</div>

<div class="app-window">

  <!-- ═══ TOPBAR (like the real app) ═══ -->
  <div class="topbar">
    <div class="topbar-title">🛡️ OTA Guard</div>
    <div class="topbar-right">
      <span class="trial-label" id="trialLabel">Free trial — 12 day(s) remaining</span>
      <button class="tb-btn" id="btnAbout">ℹ️ About</button>
      <button class="tb-btn tb-btn-accent" id="btnAssistant">🧭 Assistant</button>
      <button class="tb-btn tb-btn-red" id="btnQuit">⏻ Quit</button>
    </div>
  </div>

  <!-- ═══ TAB BAR (centered, like the real app) ═══ -->
  <div class="tabbar" id="tabbar">
    <button class="tab-btn active" data-screen="blocage">🚫 OTA price block</button>
    <button class="tab-btn" data-screen="extranet">🌐 Extranet Direct</button>
    <button class="tab-btn" data-screen="hotel">🏨 My Hotel</button>
    <button class="tab-btn" data-screen="cm">🔌 Channel Manager</button>
    <button class="tab-btn" data-screen="seasonal">📅 Seasonal rates</button>
    <button class="tab-btn" data-screen="settings">🔧 Settings</button>
    <button class="tab-btn" data-screen="mobile">📱 Mobile app</button>
  </div>

  <!-- ═══ CONTENT (screens injected by app.js) ═══ -->
  <div class="content" id="content"></div>

  <!-- ═══ STATUS BAR ═══ -->
  <div class="statusbar">
    <span>OTA Guard v3.0.4</span>
    <span>© 2026 LISBOA PVT — All rights reserved.</span>
  </div>

</div>

<!-- ═══ MODALS ═══ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
